name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy (default: master)'
        required: false
        default: master
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm nx run-many -t typecheck
      - name: Lint
        run: pnpm nx run-many -t lint
      - name: Test
        run: pnpm nx run-many -t test
      - name: Build
        run: pnpm nx run-many -t build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/SewerNet' }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      DEPLOY_REF: ${{ inputs.ref || 'master' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ensure deploy path
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "$(printf 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          hint="sudo chown -R $(id -un) $DEPLOY_PATH"
          if ! mkdir -p "$DEPLOY_PATH" 2>/dev/null; then
            printf '[deploy] Error: cannot create %s; hint: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          if [ ! -w "$DEPLOY_PATH" ] || { [ -e "$DEPLOY_PATH/.env" ] && [ ! -w "$DEPLOY_PATH/.env" ]; }; then
            printf '[deploy] Error: no write access to %s; hint: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          REMOTE
      - name: Write .env
        run: |
          set -euo pipefail
          env_file=$(printf %q "$DEPLOY_PATH/.env")
          printf '%s\n' "$PROD_ENV" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > $env_file"
      - name: Deploy
        run: |
          set -euo pipefail
          ref=$(printf %q "$DEPLOY_REF")
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") bash -s -- $ref" \
            < scripts/deploy-remote.sh