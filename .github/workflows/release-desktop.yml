name: Signed desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rerun
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Full workspace checks
    uses: ./.github/workflows/checks.yml

  preflight:
    name: Validate stable tag
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout tagged source and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
      - name: Fetch master and verify tag ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags origin master
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/master
      - name: Validate stable version sources
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node tools/release/desktop-release.mjs validate-version --tag "$RELEASE_TAG"
          npm view conventional-changelog-cli@5.0.0 version --json

  signed_windows:
    name: Sign and build Windows updater bundle
    needs: [checks, preflight]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-release
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
      - name: Install npm dependencies
        run: npm ci
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
      - name: Verify signing key configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node tools/release/desktop-release.mjs validate-version --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Stable tag/version validation failed' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is required' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw 'TAURI_UPDATER_PUBLIC_KEY is required' }
      - name: Generate temporary updater config and changelog
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) { throw 'TAURI_UPDATER_PUBLIC_KEY is required' }
          $configPath = 'apps/desktop/src-tauri/tauri.release.generated.json'
          $config = Get-Content 'apps/desktop/src-tauri/tauri.release.conf.example.json' -Raw | ConvertFrom-Json -AsHashtable
          $config.plugins.updater.pubkey = $env:TAURI_UPDATER_PUBLIC_KEY
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          npx --yes conventional-changelog-cli@5.0.0 -p angular -r 1 -o $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes' }
      - name: Build signed NSIS bundle without Nx cache
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx nx run desktop:bundle --skip-nx-cache --args="--config src-tauri/tauri.release.generated.json"
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed' }
      - name: Collect only allowlisted release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $bundleDir = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $bundleDir -Filter "SewerNet_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Expected NSIS installer is missing' }
          $releaseDir = Join-Path $env:RUNNER_TEMP 'desktop-release-assets'
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          Copy-Item $installer.FullName $releaseDir
          if (-not (Test-Path "$($installer.FullName).sig")) { throw 'Tauri updater signature is missing' }
          Copy-Item "$($installer.FullName).sig" $releaseDir
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = Get-Content $notesPath -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'Release notes are empty' }
          $manifest = @{
            version = $version
            notes = $notes
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            platforms = @{ 'windows-x86_64' = @{ url = "https://github.com/AshenHermit/SewerNet/releases/latest/download/$($installer.Name)"; signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim() } }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $releaseDir 'latest.json') -Encoding utf8
          Copy-Item $notesPath (Join-Path $releaseDir 'release-notes.md')
          $digest = (Get-FileHash (Join-Path $releaseDir $installer.Name) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content (Join-Path $releaseDir 'installer.sha256') "$digest  $($installer.Name)" -NoNewline
      - name: Remove temporary updater config
        if: always()
        shell: pwsh
        run: Remove-Item 'apps/desktop/src-tauri/tauri.release.generated.json' -Force -ErrorAction SilentlyContinue
      - name: Upload signed allowlisted bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: signed-desktop-release
          path: ${{ runner.temp }}/desktop-release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Validate draft and publish
    needs: [checks, preflight, signed_windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.0
      - name: Publish-job release preflight
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$GITHUB_REPOSITORY" == 'AshenHermit/SewerNet' ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags origin master
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" refs/remotes/origin/master
          node tools/release/desktop-release.mjs validate-version --tag "$RELEASE_TAG"
      - name: Download signed allowlisted bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-desktop-release
          path: ${{ runner.temp }}/desktop-release-assets
      - name: Validate transferred signed metadata
        shell: bash
        run: |
          dir='${{ runner.temp }}/desktop-release-assets'
          [[ -f "$dir/release-notes.md" && ! -L "$dir/release-notes.md" ]]
          [[ -f "$dir/installer.sha256" && ! -L "$dir/installer.sha256" ]]
          cp "$dir/release-notes.md" '${{ runner.temp }}/release-notes.md'
      - name: Validate draft assets and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_ARTIFACTS_DIR: ${{ runner.temp }}/desktop-release-assets
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_DIGEST_FILE: ${{ runner.temp }}/desktop-release-assets/installer.sha256
        run: node tools/release/publish-desktop.mjs publish
