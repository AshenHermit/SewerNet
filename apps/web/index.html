<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SewerNet</title>
    <base href="/" />
    <!-- `viewport-fit=cover` unlocks the safe-area insets; `interactive-widget=
         resizes-content` keeps the composer above the mobile keyboard. Zoom is
         deliberately left enabled (no `maximum-scale`/`user-scalable=no`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />    <meta
      name="description"
      content="SewerNet — a customizable cross-platform Matrix messenger."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
