[package]
name = "sewernet-desktop"
version = "0.1.0"
description = "SewerNet desktop application"
authors = ["SewerNet contributors"]
edition = "2024"
rust-version = "1.100"

[lib]
name = "sewernet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sewernet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
hex = "0.4"
keyring-core = "1.0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.9", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
thiserror = "2"
url = "2"
windows-native-keyring-store = { version = "1.1.0", default-features = false, features = ["search"] }

