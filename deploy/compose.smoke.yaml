# Synthetic, credential-free overlay for local/CI HTTP smoke tests.
# Compose merges `ports` lists by index, so this entry overrides the base
# loopback mapping with a host-accessible one.
services:
  reverse-proxy:
    container_name: reverse-proxy-smoke
    build:
      args:
        SITE_HOST: sewer-net.example.test
        APP_HOST: sewer-net-app.example.test
    environment:
      SITE_HOST: sewer-net.example.test
      APP_HOST: sewer-net-app.example.test
    ports:
      - '0.0.0.0:8082:80'
