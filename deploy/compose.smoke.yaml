# Synthetic, credential-free overlay for local/CI HTTP smoke tests.
# No published ports — smoke test runs inside the stack at http://reverse-proxy:80
services:
  reverse-proxy-smoke:
    container_name: reverse-proxy
    build:
      args:
        SITE_HOST: sewer-net.example.test
        APP_HOST: sewer-net-app.example.test
    environment:
      SITE_HOST: sewer-net.example.test
      APP_HOST: sewer-net-app.example.test
    depends_on:
      backend:
        condition: service_started
        required: true
      landing:
        condition: service_started
        required: true
    networks:
      services: {}
