# Synthetic, credential-free overlay for local/CI HTTP smoke tests.
# Requires Docker Compose v2.24.4+ for the `!reset` tag.
services:
  reverse-proxy:
    build:
      args:
        SITE_HOST: sewer-net.example.test
        APP_HOST: sewer-net-app.example.test
    environment:
      SITE_HOST: sewer-net.example.test
      APP_HOST: sewer-net-app.example.test
    ports: !reset
      - '0.0.0.0:8080:80'
